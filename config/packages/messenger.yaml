framework:
    messenger:
        buses:
            messenger.bus.default:
                middleware:
                    - webignition\SymfonyMessengerDelayMiddleware\DelayMiddleware
        transports:
            create_machine:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:CREATE_RETRY_LIMIT)%'

            get_machine:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:GET_RETRY_LIMIT)%'

            find_machine:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:FIND_RETRY_LIMIT)%'

            delete_machine:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: '%env(int:DELETE_RETRY_LIMIT)%'

            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            'App\Message\CreateMachine': create_machine
            'App\Message\GetMachine': get_machine
            'App\Message\FindMachine': find_machine
            'App\Message\FindMachineForCreation': find_machine
            'App\Message\FindMachineForRetrieval': find_machine
            'App\Message\FindMachineAfterDeletion': find_machine
            'App\Message\DeleteMachine': delete_machine

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'

            routing:
                '*': async
